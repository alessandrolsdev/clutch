services:
  traefik:
    image: traefik:v3.3
    container_name: clutch_traefik
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.ping.address=:8082
      - --ping=true
      - --ping.entrypoint=ping
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      presence:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - clutch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clutch_frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      INTERNAL_API_URL: http://backend:3344
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - clutch

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clutch_backend
    restart: unless-stopped
    working_dir: /app
    command: sh ./scripts/container-dev-start.sh
    environment:
      NODE_ENV: development
      PORT: "3344"
      DATABASE_URL: postgresql://clutch_admin:${POSTGRES_PASSWORD:-clutch_dev_pass}@postgres:5432/clutch_main_db
      REDIS_URL: redis://redis:6379
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clutch_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-clutch-dev-secret-change-in-production}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3344"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3344/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - clutch

  presence:
    build:
      context: ./backend/presence-service
      dockerfile: Dockerfile
    container_name: clutch_presence
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      PRESENCE_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-clutch-dev-secret-change-in-production}
      PRESENCE_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - clutch

  postgres:
    image: postgres:15-alpine
    container_name: clutch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clutch_main_db
      POSTGRES_USER: clutch_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clutch_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clutch_admin -d clutch_main_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clutch

  redis:
    image: redis:7-alpine
    container_name: clutch_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - clutch

networks:
  clutch:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
  redis_data:
