name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Typecheck, Lint, Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clutch_main_db
          POSTGRES_USER: clutch_admin
          POSTGRES_PASSWORD: clutch_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://clutch_admin:clutch_test_pass@localhost:5432/clutch_main_db
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: error

  frontend:
    name: Frontend - Typecheck, Lint, Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      INTERNAL_API_URL: http://backend:3344
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  container-smoke:
    name: Container stack smoke test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24 for websocket smoke helper
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for public routes
        shell: bash
        run: |
          set -euo pipefail

          for path in /api/health /presence/health /login; do
            echo "Aguardando ${path}..."
            for attempt in {1..60}; do
              if curl -fsS "http://localhost${path}" >/dev/null; then
                echo "${path} pronto"
                break
              fi

              if [ "${attempt}" -eq 60 ]; then
                echo "Timeout aguardando ${path}"
                docker compose ps
                exit 1
              fi

              sleep 5
            done
          done

      - name: Bootstrap demo data
        run: docker compose exec -T backend sh ./scripts/container-bootstrap.sh

      - name: Validate backend health
        run: curl -fsS http://localhost/api/health

      - name: Validate presence health
        run: curl -fsS http://localhost/presence/health

      - name: Validate frontend login route
        run: curl -fsS http://localhost/login > /dev/null

      - name: Validate session login via proxy
        shell: bash
        run: |
          set -euo pipefail

          login_status="$(curl -sS \
            -D /tmp/login-headers.txt \
            -c /tmp/clutch-session.cookies \
            -o /tmp/login-response.json \
            -w "%{http_code}" \
            -X POST http://localhost/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"clutchplayer@clutch.gg","password":"clutch123"}')"

          if [ "${login_status}" != "200" ]; then
            echo "Falha no login via proxy. Status: ${login_status}"
            echo "--- login headers ---"
            cat /tmp/login-headers.txt
            echo "--- login body ---"
            cat /tmp/login-response.json
            exit 1
          fi

          if ! grep -iq '^set-cookie: clutch_session=' /tmp/login-headers.txt; then
            echo "Login nao retornou o cookie de sessao esperado."
            echo "--- login headers ---"
            cat /tmp/login-headers.txt
            echo "--- login body ---"
            cat /tmp/login-response.json
            exit 1
          fi

          me_status="$(curl -sS \
            -b /tmp/clutch-session.cookies \
            -o /tmp/auth-me-response.json \
            -w "%{http_code}" \
            http://localhost/api/auth/me)"

          if [ "${me_status}" != "200" ]; then
            echo "Falha ao restaurar sessao via /api/auth/me. Status: ${me_status}"
            echo "--- login headers ---"
            cat /tmp/login-headers.txt
            echo "--- auth/me body ---"
            cat /tmp/auth-me-response.json
            exit 1
          fi

          grep -q '"username":"clutchplayer"' /tmp/auth-me-response.json

      - name: Validate presence credential route
        shell: bash
        run: |
          set -euo pipefail

          presence_status="$(curl -sS \
            -b /tmp/clutch-session.cookies \
            -o /tmp/presence-token-response.json \
            -w "%{http_code}" \
            http://localhost/api/auth/presence-token)"

          if [ "${presence_status}" != "200" ]; then
            echo "Falha ao obter a credencial de presence. Status: ${presence_status}"
            echo "--- presence token body ---"
            cat /tmp/presence-token-response.json
            exit 1
          fi

          grep -q '"token":"' /tmp/presence-token-response.json

      - name: Validate authenticated websocket handshake
        env:
          PRESENCE_TOKEN_FILE: /tmp/presence-token-response.json
          PRESENCE_WS_URL: ws://localhost
          PRESENCE_WS_ORIGIN: http://localhost
          PRESENCE_WS_TIMEOUT_MS: 15000
        run: node ./scripts/ci/validate-presence-handshake.mjs

      - name: Collect stack logs
        if: always()
        run: docker compose logs --no-color backend frontend presence traefik > /tmp/clutch-stack.logs

      - name: Fail on sensitive data in stack logs
        if: success()
        run: node ./scripts/ci/check-sensitive-logs.mjs scan /tmp/clutch-stack.logs

      - name: Show compose status
        if: always()
        run: docker compose ps

      - name: Show sanitized compose logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f /tmp/clutch-stack.logs ]; then
            docker compose logs --no-color backend frontend presence traefik > /tmp/clutch-stack.logs
          fi

          tail -n 200 /tmp/clutch-stack.logs > /tmp/clutch-stack-tail.logs
          node ./scripts/ci/check-sensitive-logs.mjs sanitize /tmp/clutch-stack-tail.logs

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
